<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punto &amp; Aparte</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--teal:#0097b2;--lime:#e3ef00;--paper:#e9f5f8;--mute:#9fc9d4;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--teal:#0097b2;--lime:#e3ef00;--paper:#e9f5f8;--mute:#9fc9d4}}
:root[data-theme="dark"]{--bg:#000000;--teal:#0097b2;--lime:#e3ef00;--paper:#e9f5f8;--mute:#9fc9d4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--paper);font-family:"Playfair Display",Georgia,"Times New Roman",serif;line-height:1.5;
min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:28px 22px 48px;display:flex;flex-direction:column;align-items:stretch}
.logo{display:block;width:min(100%,320px);height:auto;margin:0 auto 20px}
h2{margin:26px 0 14px;font-size:1.05rem;font-weight:500;color:var(--mute);letter-spacing:.01em}
.links{display:flex;flex-direction:column;gap:18px;margin:0;padding:0;list-style:none}
.btn{display:flex;align-items:center;gap:16px;padding:14px 18px;min-height:76px;text-decoration:none;color:var(--paper);
background:var(--bg);border:2px solid var(--teal);border-radius:4px;box-shadow:7px 7px 0 var(--lime);
transition:transform .14s ease,box-shadow .14s ease}
.btn img{width:auto;height:48px;flex:none}
.btn span{display:flex;flex-direction:column;min-width:0}
.btn strong{font-weight:600;font-size:1.2rem;color:var(--teal)}
.btn small{font-size:.95rem;color:var(--mute);overflow-wrap:anywhere}
.btn:hover{transform:translate(3px,3px);box-shadow:4px 4px 0 var(--lime)}
.btn:active{transform:translate(7px,7px);box-shadow:0 0 0 var(--lime)}
.btn:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
